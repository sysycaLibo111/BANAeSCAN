{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATEGORY PART</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>  
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js"></script>
    
    <style>
       /* General Body Styles */
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

/* Sidebar Styles */
nav.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 250px;
    height: 100vh;
    background-color: #c1b22e;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

/* Logo Styles */
nav .logo {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
}

nav .logo img {
    height: 50px;
    margin-right: 10px;
    border-radius: 50%;
}

nav .logo span {
    color: black;
    font-size: 30px;
    font-weight: bold;
}

/* Sidebar Menu */
nav .menu {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
    margin-left: 20px;
}

nav .menu a {
    color: black;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
}

nav .menu a:hover {
    background-color: white;
    border-top-left-radius: 20px; 
    border-bottom-left-radius: 20px; 
    width: 220px;
    height: 50px;
    color: green;
}

/* Burger Menu */
.burger {
    display: none;
    cursor: pointer;
    margin-bottom: 10px;
}

.burger div {
    width: 25px;
    height: 3px;
    background-color: white;
    margin: 4px 0;
}

/* Logo Container */
.logo-container {
    margin-left: 50px;
    align-items: center;
}

.logo {
    width: 150px;
    padding: 5px;
    border-radius: 50%;
    border: 2px solid rgb(231, 235, 231);
    align-items: center;
    height: auto;
}

/* Content Styling */
.content {
    margin-left: 250px;
    transition: margin-left 0.3s;
 
}

/* Card Container Styling */
.card-container {
    padding: 50px;
}

/* Action Button Styling */
.action-btn {
    padding: 10px 10px;
    font-size: 25px;
    border-radius: 5px;
    background-color: #0d6efd;
}

/* Navigation Bar Styles */
.nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background-color: #f8f9fa;
    border-bottom: 1px solid #ddd;
}


.nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
/* Search Box Styling */
.search-box {
    justify-self: end;
    font-size: 25px;
    color: white;
    margin-left: 12in;
}

.search-box input[type="text"] {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #0a0606;
}

/* Icons in Navigation */
.icons {
    display: flex;
    gap: 10px;
    padding: 15px;
    font-size: 30px;
}
.card-custom {
            width: 15in;
            margin-top: 20px;
            margin-left: 3in;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(10, 215, 3, 0.883);
            border-radius: 10px;
            font-size: 1.5rem;
        }

        table.table {
            
            border: 1px solid black;
        }

        table.table th {
            background-color: green;
            color: white;
            height: 20px;
            vertical-align: middle;
            border: 1px solid black;
        }

        table.table td {
            border: 1px solid black;
            height: 20px;
            vertical-align: middle;
        }
        /* Set fixed height for table cells */
        .btn-add {
            margin-top: 10px;
            margin-left: 3in;
            font-size: 1.5rem;
            background-color: #c1b22e;
            border: 1px solid #080808;
        }
        .descrip{
            width: 7.5in;
        }
        .edit-btn, .delete-btn {
    font-size: 1.5rem;
}
.act-btn{
    width: 2.5in;
}

    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo-container">
            <img src="{% static 'img/LogoW.png' %}" alt="Logo" class="logo">
        </div>
        <div class="menu">
            <a href="{% url 'admin_dashboard' %}"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="{% url 'product_list' %}"><i class="fas fa-box"></i>Products</a>
            <a href="{% url 'orders_part' %}"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="#"><i class="fas fa-chart-line"></i> Sales</a>
            <a href="{% url 'customer_table' %}"><i class="bi bi-people-fill"></i> Customers</a>
            <a href="#"><i class="fas fa-file-alt"></i> Reports</a>
        </div>
        <div class="burger" id="burger" onclick="toggleNav()">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </nav>
    <div class="content">
        <div class="nav-bar">
            <P style=" font-weight: bold; font-size: 25px;padding: 15px;">CATEGORY MANAGEMENT</P>
            <p id="datetime"></p>
            <div class="search-box"  >
                <input type="text" placeholder="Search...">
                <button class="action-btn" style="color: white;">Search</button>
            </div>
                <div class="logout-icon" onclick="toggleLogout()" style="cursor: pointer;">
                  <a href="{% url 'logout' %}" style="color: #8A2B13; font-size: 35px;"><i class="fas fa-sign-out-alt"></i></a>
                </div>
            </div>
                <button class="btn btn-add" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
                    <i class="bi bi-plus"></i> Add Category
                </button>
        
                <div class="card card-custom">
                    <table class="table mt-3">
                        <thead>
                            <tr>
                                <!-- <th>ID</th> -->
                                <th>Name</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody">
                            {% for category in categories %}
                            <tr id="category-{{ category.id }}">
                                <!-- <td>{{ category.id }}</td> -->
                                <td>{{ category.name }}</td>
                                <td class="descrip">{{ category.description }}</td>
                                <td class="act-btn">
                                    <button class="btn btn-warning btn-sm edit-btn" data-id="{{ category.id }}" data-name="{{ category.name }}" data-description="{{ category.description }}">
                                        <i class="bi bi-pencil-square"></i> Edit
                                    </button>
                                    <button class="btn btn-danger btn-sm delete-btn" data-id="{{ category.id }}">
                                        <i class="fas fa-trash"></i> Delete
                                    </button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        
            <!-- Add Category Modal -->
            <div class="modal fade" id="addCategoryModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add Category</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="text" id="categoryName" class="form-control" placeholder="Category Name">
                            <textarea id="categoryDescription" class="form-control mt-2" placeholder="Description"></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="button" class="btn btn-primary" id="saveCategory">Save</button>
                        </div>
                    </div>
                </div>
            </div>
        
            <!-- Edit Category Modal -->
            <div class="modal fade" id="editCategoryModal" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Edit Category</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="editCategoryId">
                            <input type="text" id="editCategoryName" class="form-control">
                            <textarea id="editCategoryDescription" class="form-control mt-2"></textarea>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" id="updateCategory">Update</button>
                        </div>
                    </div>
                </div>
            </div>
     </div>
    
    
    <script>
    document.addEventListener("DOMContentLoaded", function() {
    // Add Category
    document.getElementById("saveCategory").addEventListener("click", function() {
        let name = document.getElementById("categoryName").value;
        let description = document.getElementById("categoryDescription").value;
        fetch("{% url 'add_category' %}", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify({ name, description })
        })
        .then(response => response.json())
        .then(data => {
            let row = `<tr id="category-${data.id}">
                <td>${data.id}</td>
                <td>${data.name}</td>
                <td>${data.description}</td>
                <td>
                    <button class="btn btn-warning btn-sm edit-btn" data-id="${data.id}" data-name="${data.name}" data-description="${data.description}">Edit</button>
                    <button class="btn btn-danger btn-sm delete-btn" data-id="${data.id}">Delete</button>
                </td>
            </tr>`;
            document.getElementById("categoryTableBody").insertAdjacentHTML("beforeend", row);
            document.getElementById("categoryName").value = "";
            document.getElementById("categoryDescription").value = "";
            new bootstrap.Modal(document.getElementById("addCategoryModal")).hide();
        });
    });

    // Open Edit Modal
    document.addEventListener("click", function(event) {
        if (event.target.classList.contains("edit-btn")) {
            let id = event.target.getAttribute("data-id");
            let name = event.target.getAttribute("data-name");
            let description = event.target.getAttribute("data-description");
            document.getElementById("editCategoryId").value = id;
            document.getElementById("editCategoryName").value = name;
            document.getElementById("editCategoryDescription").value = description;
            new bootstrap.Modal(document.getElementById("editCategoryModal")).show();
        }
    });

    // Update Category
    document.getElementById("updateCategory").addEventListener("click", function() {
        let id = document.getElementById("editCategoryId").value;
        let name = document.getElementById("editCategoryName").value;
        let description = document.getElementById("editCategoryDescription").value;
        fetch(`/edit-category/${id}/`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
            body: JSON.stringify({ name, description })
        })
        .then(response => response.json())
        .then(data => {
            document.querySelector(`#category-${data.id} td:nth-child(2)`).textContent = data.name;
            document.querySelector(`#category-${data.id} td:nth-child(3)`).textContent = data.description;
            new bootstrap.Modal(document.getElementById("editCategoryModal")).hide();
        });
    });

    // Delete Category
    document.addEventListener("click", function(event) {
        if (event.target.classList.contains("delete-btn")) {
            let id = event.target.getAttribute("data-id");
            fetch(`/delete-category/${id}/`, { method: "POST", headers: { "X-CSRFToken": "{{ csrf_token }}" } })
            .then(() => document.getElementById(`category-${id}`).remove());
        }
    });
});
    function toggleNav() {
    const sidebar = document.querySelector('nav.sidebar');
    const content = document.querySelector('.content');

    if (sidebar.style.display === 'none' || sidebar.style.display === '') {
        sidebar.style.display = 'flex'; // Show sidebar
        content.style.marginLeft = '250 px'; // Reset content margin
    } else {
        sidebar.style.display = 'none'; // Hide sidebar
        content.style.marginLeft = '0'; // Full width for content
    }
}
        function toggleMessages() {
            // Logic to show/hide messages dropdown
        }

        function toggleNotifications() {
            // Logic to show/hide notifications dropdown
        }
       
        function toggleProfile() {
    var dropdown = document.getElementById("profileDropdown");
    dropdown.style.display = dropdown.style.display === "none" ? "block" : "none";
}

// Optional: Handle form submission via AJAX
document.getElementById("profileForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var formData = new FormData(this);

            fetch("{% url 'update_profile' %}", {
                method: "POST",
                body: formData,
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}",
                },
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert("Profile updated successfully!");
                        location.reload(); // Reload the page to reflect changes
                    } else {
                        alert("Error updating profile: " + data.error);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                });
        });

        function toggleLogout() {
            // Logic to show/hide profile dropdown
        }
    </script>
</body>
</html>
