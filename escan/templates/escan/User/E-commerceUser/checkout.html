{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
</head>
<body>
    <h1>Checkout</h1>
    <p>Product: {{ product.name }}</p>
    <p>Quantity: {{ quantity }}</p>
    <p>Total Amount: ${{ total_amount }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Order</button>
    </form>
</body>
</html>
